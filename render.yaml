# Render Blueprint Specification
# See https://render.com/docs/blueprints for details
services:
  - type: web
    name: syncrate-promo
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
