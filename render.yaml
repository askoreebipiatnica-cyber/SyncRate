# Render Blueprint Specification
# See https://render.com/docs/blueprints for details
services:
  - type: web
    name: syncrate-promo
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Add environment variables that need to be defined manually in the Render dashboard:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYANYWAY_MNT_ID
        sync: false
      - key: PAYANYWAY_MNT_SIGNATURE_KEY
        sync: false
