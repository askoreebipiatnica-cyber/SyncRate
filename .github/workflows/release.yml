name: Release Extension

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension and pack ZIP
        run: npm run build

      - name: Upload SyncRate.zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SyncRate.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
